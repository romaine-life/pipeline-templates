name: Fingerprint proof
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
concurrency:
  group: fingerprint-proof-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.scope.outputs.checks }}
      suite: ${{ steps.scope.outputs.suite }}
      release-matrix: ${{ steps.scope.outputs.release-matrix }}
      has-local: ${{ steps.scope.outputs.has-local }}
      test-linux: ${{ steps.scope.outputs.test-linux }}
      test-windows: ${{ steps.scope.outputs.test-windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: ref
        run: node suites/tests/reuse-proof.mjs ref
      - uses: actions/checkout@v4
        with:
          repository: romaine-life/pipeline-templates
          ref: ${{ steps.ref.outputs.ref }}
          path: _ci
          persist-credentials: false
      - uses: ./_ci/actions/suite
      - id: scope
        run: node _ci/suites/tests/reuse-proof.mjs scope
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release-reserve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
  release-build:
    needs: [ scope, release-reserve ]
    if: needs.scope.outputs.has-local == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJSON(needs.scope.outputs.release-matrix) }}
    steps:
      - run: exit 1
  verify:
    needs:
      - scope
      - check-test-linux
      - check-test-windows
      - release-build
    if: always() && github.event_name == 'pull_request' && needs.scope.result == 'success' && (needs.check-test-linux.result == 'success' || needs.check-test-linux.result == 'skipped') && (needs.check-test-windows.result == 'success' || needs.check-test-windows.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: romaine-life/pipeline-templates
          ref: ${{ needs.scope.outputs.suite }}
          path: _ci
          persist-credentials: false
      - uses: ./_ci/actions/suite
      - run: node _ci/suites/tests/reuse-proof.mjs verify
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FINGERPRINTS: ${{ needs.scope.outputs.checks }}
  check-test-linux:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.test-linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: romaine-life/pipeline-templates
          ref: ${{ needs.scope.outputs.suite }}
          path: _ci
          persist-credentials: false
      - uses: ./_ci/actions/suite
      - uses: ./_ci/actions/home-cache
      - uses: ./_ci/actions/rust-toolchain
      - run: node _ci/suites/tests/reuse-proof.mjs check
  check-test-windows:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.test-windows == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: romaine-life/pipeline-templates
          ref: ${{ needs.scope.outputs.suite }}
          path: _ci
          persist-credentials: false
      - uses: ./_ci/actions/suite
      - uses: ./_ci/actions/home-cache
      - uses: ./_ci/actions/rust-toolchain
      - run: node _ci/suites/tests/reuse-proof.mjs check
