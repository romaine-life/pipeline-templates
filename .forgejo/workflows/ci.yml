name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      home-cache: ${{ steps.diff.outputs.home-cache }}
      setup: ${{ steps.diff.outputs.setup }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo home-cache=true >> "$GITHUB_OUTPUT"
            echo setup=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qE '^actions/home-cache/|^\.forgejo/workflows/ci\.yml$' <<< "$files"; then
            echo home-cache=true >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^actions/(setup-[a-z]+/|rust-toolchain/|home-cache/|pins\.txt$)|^\.forgejo/workflows/ci\.yml$' <<< "$files"; then
            echo setup=true >> "$GITHUB_OUTPUT"
          fi

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz https://artifacts.home.romaine.life/general/github/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint

      - name: Lint the Forgejo workflows
        run: ./actionlint .forgejo/workflows/*.yml reference/*.yml

      - name: Check configuration checkout authorization and failure handling
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const yaml = fs.readFileSync('.forgejo/workflows/home-sync.yml', 'utf8').replaceAll('\r', '');
          const checkout = yaml.indexOf('- name: Update the NAS home-profile checkout');
          assert.ok(checkout >= 0 && checkout < yaml.indexOf('- name: Publish the complete draft'));
          const match = yaml.slice(checkout).match(/node <<'JS'\n([\s\S]*?)\n\s+JS/);
          assert.ok(match, 'execute the actual checkout step');
          const code = match[1].replace(/^ {10}/gm, '');
          for (const test of [
            {repo: 'romaine-life/shell-config-profile-home', status: 0},
            {repo: 'romaine-life/at-home-tools', status: 0, error: /only the home-profile/},
            {repo: 'romaine-life/shell-config-profile-home', status: 1, error: /SSH exit 1/},
            {repo: 'romaine-life/shell-config-profile-home', failure: new Error('timeout'), error: /timeout/}
          ]) {
            const calls = [];
            const run = () => vm.runInNewContext(code, {
              process: {env: {CHECKOUT_REPOSITORY: test.repo}},
              require(name) {
                assert.equal(name, 'node:child_process');
                return {spawnSync(...args) { calls.push(args); return {status: test.status, error: test.failure}; }};
              }
            });
            if (test.error) assert.throws(run, test.error); else run();
            assert.equal(calls.length, test.repo === 'romaine-life/shell-config-profile-home' ? 1 : 0);
            if (calls.length) {
              assert.equal(calls[0][0], 'ssh');
              assert.equal(calls[0][1].at(-1), 'Nelson@nas');
              assert.ok(calls[0][1].includes('StrictHostKeyChecking=yes'));
              assert.equal(calls[0][2].timeout, 90000);
            }
          }
          console.log('configuration checkout authorization and failure handling passed');
          JS

      - name: Check draft publication before the PC trigger
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const http = require('node:http');
          const {spawn} = require('node:child_process');
          const yaml = fs.readFileSync('.forgejo/workflows/home-sync.yml', 'utf8').replaceAll('\r', '');
          const section = yaml.slice(yaml.indexOf('- name: Publish the complete draft'));
          const match = section.match(/node <<'JS'\n([\s\S]*?)\n\s+JS/);
          assert.ok(match, 'test must run the real publication step');
          const code = match[1].replace(/^ {10}/gm, '');
          let current, requests;
          const server = http.createServer((req, res) => {
            requests.push(req.method);
            assert.equal(req.headers.authorization, 'token ci-release-token');
            res.setHeader('Content-Type', 'application/json');
            if (req.method === 'GET') {
              assert.equal(req.url, '/releases/tags/v1.2.3');
              res.statusCode = current.getDenied ? 403 : 200;
              res.end(JSON.stringify({id: 7, draft: current.draft !== false,
                prerelease: !!current.prerelease, assets: current.empty ? [] : [{name: 'tool.exe'}]}));
            } else {
              assert.equal(req.method, 'PATCH');
              assert.equal(req.url, '/releases/7');
              let body = '';
              req.on('data', chunk => body += chunk);
              req.on('end', () => {
                assert.deepEqual(JSON.parse(body), {draft: false});
                res.statusCode = current.patchDenied ? 403 : 200;
                res.end('{"draft":false}');
              });
            }
          });
          (async () => {
            await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
            try {
              const cases = [
                {name: 'ready draft', exit: 0, methods: ['GET', 'PATCH']},
                {name: 'empty draft', empty: true, exit: 1, methods: ['GET']},
                {name: 'prerelease', prerelease: true, exit: 1, methods: ['GET']},
                {name: 'lookup denied', getDenied: true, exit: 1, methods: ['GET']},
                {name: 'publication denied', patchDenied: true, exit: 1, methods: ['GET', 'PATCH']},
                {name: 'already public', draft: false, exit: 0, methods: ['GET']},
                {name: 'no token', token: '', exit: 1, methods: []},
                {name: 'invalid tag', tag: '../other', exit: 1, methods: []}
              ];
              for (current of cases) {
                requests = [];
                let output = '';
                const result = await new Promise((resolve, reject) => {
                  const child = spawn(process.execPath, ['-e', code], {env: {...process.env,
                    API: `http://127.0.0.1:${server.address().port}`,
                    TAG: current.tag ?? 'v1.2.3', TOKEN: current.token ?? 'ci-release-token'}});
                  child.stdout.on('data', chunk => output += chunk);
                  child.stderr.on('data', chunk => output += chunk);
                  child.on('error', reject);
                  child.on('close', resolve);
                });
                assert.equal(result, current.exit, `${current.name}: ${output}`);
                assert.deepEqual(requests, current.methods, current.name);
                assert.ok(!output.includes('ci-release-token'), 'token must not reach logs');
                console.log(`passed: ${current.name}`);
              }
            } finally { await new Promise(resolve => server.close(resolve)); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS

  # The release cleanup step (actions/prune-releases) that home-sync.yml and release jobs run.
  prune-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The step's tests
        run: node --test actions/prune-releases/tests/prune.test.js

  # The check every repo's CI runs (actions/check-fetches), on its tests and on this repo.
  check-fetches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The check's tests
        run: python3 -m unittest discover -v actions/check-fetches/tests
      - uses: ./actions/check-fetches

  # The rendered-manifest check (actions/check-image-digests) every cluster service's CI runs.
  check-image-digests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The check's tests
        run: python3 -m unittest discover -v actions/check-image-digests/tests
      - name: A rendered manifest, its image named by digest
        run: |
          printf '%s\n' 'kind: Pod' 'spec:' '  containers:' \
            '    - image: docker.io/library/alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f' \
            > "$RUNNER_TEMP/rendered.yaml"
      - uses: ./actions/check-image-digests
        with:
          manifests: ${{ runner.temp }}/rendered.yaml

  # The image names step (actions/cached-images): Artifact Keeper's caches, then a real pull.
  cached-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The step's tests
        run: python3 -m unittest discover -v actions/cached-images/tests
      - name: An image as a manifest names it
        run: echo 'ALPINE=alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f' >> "$GITHUB_ENV"
      - uses: ./actions/cached-images
        with:
          vars: ALPINE
      - name: The image comes from Artifact Keeper
        run: |
          set -euo pipefail
          test "$ALPINE" = artifacts.home.romaine.life/dockerhub/library/alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
          docker pull "$ALPINE"

  # The Azure CLI step (actions/azure-cli): installed through Artifact Keeper, and it runs.
  azure-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/azure-cli
      - name: az answers from the tool cache
        run: |
          set -euo pipefail
          case "$(command -v az)" in "$RUNNER_TOOL_CACHE"/azure-cli/*) ;; *) echo "az is $(command -v az)"; exit 1 ;; esac
          az version

  # The setup step (actions/home-cache) on each kind of runner, then a real fetch through it.
  home-cache-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/home-cache
      - name: apt reads Ubuntu through Artifact Keeper
        run: |
          set -euo pipefail
          grep -rq 'artifacts.home.romaine.life/debian/ubuntu/' /etc/apt/sources.list /etc/apt/sources.list.d/
          ! grep -rqE 'https?://(archive|security)\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d/
          sudo apt-get update
          apt-get download hello
      - name: cargo reads crates through Artifact Keeper
        run: |
          set -euo pipefail
          command -v cargo >/dev/null || { echo "no cargo in this image; its config is checked instead"; grep -q 'cargo/crates' "${CARGO_HOME:-$HOME/.cargo}/config.toml"; exit 0; }
          d=$(mktemp -d)
          cargo init -q --vcs none "$d/probe"
          printf 'itoa = "1"\n' >> "$d/probe/Cargo.toml"
          cargo fetch -v --manifest-path "$d/probe/Cargo.toml" 2>&1 | tee "$d/log"
          grep -q 'artifacts.home.romaine.life' "$d/log"

  home-cache-windows:
    needs: changes
    if: needs.changes.outputs.home-cache == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/home-cache
      - name: cargo and NuGet name Artifact Keeper
        shell: pwsh
        run: |
          $cargo = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          if (-not (Select-String -Quiet -LiteralPath (Join-Path $cargo 'config.toml') -Pattern 'artifacts.home.romaine.life/cargo/crates')) { throw 'cargo config' }
          if (-not (Select-String -Quiet -LiteralPath (Join-Path $env:APPDATA 'NuGet\NuGet.Config') -Pattern 'artifacts.home.romaine.life/nuget')) { throw 'NuGet config' }

  # The setup actions on both Linux runners (the cluster's, which alone has `nas`, and
  # upstairspc's WSL one): each installs through Artifact Keeper, and the tool it put on
  # PATH is the one that runs. setup-python nests astral-sh/setup-uv, setup-node
  # actions/setup-node, setup-go actions/setup-go.
  setup-linux:
    needs: changes
    if: needs.changes.outputs.setup == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [nas, upstairspc-linux]
    runs-on: [ubuntu-latest, "${{ matrix.runner }}"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/home-cache
      - id: node
        uses: ./actions/setup-node
        with:
          node-version: "22"
      - uses: ./actions/setup-opentofu
        with:
          tofu-version: 1.11.0
      - id: dotnet
        uses: ./actions/setup-dotnet
        with:
          dotnet-version: "9.0"
      - id: rust
        uses: ./actions/rust-toolchain
        with:
          components: clippy, rustfmt
      - id: uv
        uses: ./actions/setup-uv
      - id: python
        uses: ./actions/setup-python
        with:
          python-version: "3.12"
      - name: A go.mod whose toolchain line names the Go
        run: |
          mkdir -p "$RUNNER_TEMP/go-probe"
          printf '%s\n' 'module example.com/probe' '' 'go 1.25.0' '' 'toolchain go1.26.2' > "$RUNNER_TEMP/go-probe/go.mod"
      - id: go
        uses: ./actions/setup-go
        with:
          go-version-file: ${{ runner.temp }}/go-probe/go.mod
          cache: false
      - name: Each tool runs from what its action installed
        env:
          WANT_NODE: ${{ steps.node.outputs.node-version }}
          WANT_DOTNET: ${{ steps.dotnet.outputs.dotnet-version }}
          WANT_RUST: ${{ steps.rust.outputs.toolchain }}
          WANT_UV: ${{ steps.uv.outputs.uv-version }}
          WANT_PYTHON: ${{ steps.python.outputs.python-version }}
          WANT_GO: ${{ steps.go.outputs.go-version }}
        run: |
          set -euo pipefail
          # go-ec7381f6 is the folder setup-go@v6 named itself for the runners'
          # GO_DOWNLOAD_BASE_URL (PIPT-5); the action's copy must be that one, and the only one.
          go_dir="$RUNNER_TOOL_CACHE/go-ec7381f6/1.26.2/x64"
          [ "$(readlink -f "$(command -v go)")" = "$(readlink -f "$go_dir/bin/go")" ] || { echo "go is $(command -v go)"; exit 1; }
          copies=("$RUNNER_TOOL_CACHE"/go-*/1.26.2)
          [ "${#copies[@]}" = 1 ] || { echo "Go 1.26.2 is in ${copies[*]}"; exit 1; }
          [ "$WANT_GO" = 1.26.2 ] || { echo "setup-go reported $WANT_GO"; exit 1; }
          go=$(go version); [ "$go" = "go version go1.26.2 linux/amd64" ] || { echo "go is $go"; exit 1; }
          for tool in node tofu dotnet uv; do
            case "$(command -v "$tool")" in "$RUNNER_TOOL_CACHE"/*) ;; *) echo "$tool is $(command -v "$tool")"; exit 1 ;; esac
          done
          case "$(command -v python)" in "$RUNNER_TEMP"/*) ;; *) echo "python is $(command -v python)"; exit 1 ;; esac
          node=$(node --version); [ "$node" = "$WANT_NODE" ] || { echo "node is $node"; exit 1; }
          tofu=$(tofu version); [ "${tofu%%$'\n'*}" = "OpenTofu v1.11.0" ] || { echo "tofu is $tofu"; exit 1; }
          dotnet --info
          dotnet=$(dotnet --version); [ "$dotnet" = "$WANT_DOTNET" ] || { echo "dotnet is $dotnet"; exit 1; }
          rustc=$(rustc --version); [[ "$rustc" == "rustc $WANT_RUST "* ]] || { echo "rustc is $rustc"; exit 1; }
          cargo clippy --version
          uv=$(uv --version); [[ "$uv" == "uv $WANT_UV"* ]] || { echo "uv is $uv"; exit 1; }
          python=$(python --version); [ "$python" = "Python $WANT_PYTHON" ] || { echo "python is $python"; exit 1; }
          pip --version
      - name: tofu init installs a provider through Artifact Keeper
        run: |
          set -euo pipefail
          grep -q 'artifacts.home.romaine.life/terraform/opentofu/' "$TF_CLI_CONFIG_FILE"
          d=$(mktemp -d)
          printf '%s\n' 'terraform {' '  required_providers {' \
            '    random = { source = "hashicorp/random", version = "3.9.0" }' '  }' '}' > "$d/main.tf"
          tofu -chdir="$d" init -input=false
          test -d "$d/.terraform/providers/registry.opentofu.org/hashicorp/random/3.9.0"

  setup-windows:
    needs: changes
    if: needs.changes.outputs.setup == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/home-cache
      - id: node
        uses: ./actions/setup-node
        with:
          node-version: "22"
      - uses: ./actions/setup-opentofu
        with:
          tofu-version: 1.11.0
      - id: dotnet
        uses: ./actions/setup-dotnet
        with:
          dotnet-version: "9.0"
      - id: rust
        uses: ./actions/rust-toolchain
        with:
          components: clippy, rustfmt
      - id: uv
        uses: ./actions/setup-uv
      - id: python
        uses: ./actions/setup-python
        with:
          python-version: "3.12"
      - name: A go.mod whose toolchain line names the Go
        shell: pwsh
        run: |
          $d = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'go-probe')
          Set-Content -LiteralPath "$d\go.mod" -Value @('module example.com/probe', '', 'go 1.25.0', '', 'toolchain go1.26.2')
      - id: go
        uses: ./actions/setup-go
        with:
          go-version-file: ${{ runner.temp }}/go-probe/go.mod
          cache: false
      - name: Each tool runs from what its action installed
        shell: pwsh
        env:
          WANT_NODE: ${{ steps.node.outputs.node-version }}
          WANT_DOTNET: ${{ steps.dotnet.outputs.dotnet-version }}
          WANT_RUST: ${{ steps.rust.outputs.toolchain }}
          WANT_UV: ${{ steps.uv.outputs.uv-version }}
          WANT_PYTHON: ${{ steps.python.outputs.python-version }}
          WANT_GO: ${{ steps.go.outputs.go-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # go-ec7381f6 is the folder setup-go@v6 named itself for the runners'
          # GO_DOWNLOAD_BASE_URL (PIPT-5); the action's copy must be that one, and the only one.
          $want = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TOOL_CACHE 'go-ec7381f6\1.26.2\x64\bin\go.exe'))
          $path = [IO.Path]::GetFullPath((Get-Command go).Source)
          if ($path -ne $want) { throw "go is $path" }
          $copies = @(Get-ChildItem -Directory (Join-Path $env:RUNNER_TOOL_CACHE 'go-*') | Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName '1.26.2') })
          if ($copies.Count -ne 1) { throw "Go 1.26.2 is in $($copies.FullName -join ', ')" }
          if ($env:WANT_GO -ne '1.26.2') { throw "setup-go reported $env:WANT_GO" }
          if ((go version) -ne 'go version go1.26.2 windows/amd64') { throw "go is $(go version)" }
          foreach ($tool in 'node', 'tofu', 'dotnet', 'uv') {
            $path = (Get-Command $tool).Source
            if (-not $path.StartsWith($env:RUNNER_TOOL_CACHE)) { throw "$tool is $path" }
          }
          $path = (Get-Command python).Source
          if (-not $path.StartsWith($env:RUNNER_TEMP)) { throw "python is $path" }
          if ((node --version) -ne $env:WANT_NODE) { throw "node is $(node --version)" }
          if ((tofu version)[0] -ne 'OpenTofu v1.11.0') { throw "tofu is $((tofu version)[0])" }
          dotnet --info
          if ((dotnet --version) -ne $env:WANT_DOTNET) { throw "dotnet is $(dotnet --version)" }
          if ((rustc --version) -notlike "rustc $env:WANT_RUST *") { throw "rustc is $(rustc --version)" }
          cargo clippy --version
          if ((-split (uv --version))[1] -ne $env:WANT_UV) { throw "uv is $(uv --version)" }
          if ((python --version) -ne "Python $env:WANT_PYTHON") { throw "python is $(python --version)" }
          pip --version
      - name: tofu init installs a provider through Artifact Keeper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Select-String -Quiet -LiteralPath $env:TF_CLI_CONFIG_FILE -Pattern 'artifacts.home.romaine.life/terraform/opentofu/')) { throw 'tofu config' }
          $d = Join-Path $env:RUNNER_TEMP 'tofu-probe'
          New-Item -ItemType Directory $d | Out-Null
          Set-Content -LiteralPath "$d\main.tf" -Value @('terraform {', '  required_providers {',
            '    random = { source = "hashicorp/random", version = "3.9.0" }', '  }', '}')
          tofu "-chdir=$d" init -input=false
          if (-not (Test-Path "$d\.terraform\providers\registry.opentofu.org\hashicorp\random\3.9.0")) { throw 'random 3.9.0 not installed' }
