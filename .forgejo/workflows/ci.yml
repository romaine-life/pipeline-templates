name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz https://artifacts.home.romaine.life/general/github/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint

      - name: Lint the Forgejo workflows
        run: ./actionlint .forgejo/workflows/*.yml

      - name: Check configuration checkout authorization and failure handling
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const yaml = fs.readFileSync('.forgejo/workflows/home-sync.yml', 'utf8').replaceAll('\r', '');
          const checkout = yaml.indexOf('- name: Update the NAS home-profile checkout');
          assert.ok(checkout >= 0 && checkout < yaml.indexOf('- name: Publish the complete draft'));
          const match = yaml.slice(checkout).match(/node <<'JS'\n([\s\S]*?)\n\s+JS/);
          assert.ok(match, 'execute the actual checkout step');
          const code = match[1].replace(/^ {10}/gm, '');
          for (const test of [
            {repo: 'romaine-life/shell-config-profile-home', status: 0},
            {repo: 'romaine-life/at-home-tools', status: 0, error: /only the home-profile/},
            {repo: 'romaine-life/shell-config-profile-home', status: 1, error: /SSH exit 1/},
            {repo: 'romaine-life/shell-config-profile-home', failure: new Error('timeout'), error: /timeout/}
          ]) {
            const calls = [];
            const run = () => vm.runInNewContext(code, {
              process: {env: {CHECKOUT_REPOSITORY: test.repo}},
              require(name) {
                assert.equal(name, 'node:child_process');
                return {spawnSync(...args) { calls.push(args); return {status: test.status, error: test.failure}; }};
              }
            });
            if (test.error) assert.throws(run, test.error); else run();
            assert.equal(calls.length, test.repo === 'romaine-life/shell-config-profile-home' ? 1 : 0);
            if (calls.length) {
              assert.equal(calls[0][0], 'ssh');
              assert.equal(calls[0][1].at(-1), 'Nelson@nas');
              assert.ok(calls[0][1].includes('StrictHostKeyChecking=yes'));
              assert.equal(calls[0][2].timeout, 90000);
            }
          }
          console.log('configuration checkout authorization and failure handling passed');
          JS

      - name: Check draft publication before the PC trigger
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const http = require('node:http');
          const {spawn} = require('node:child_process');
          const yaml = fs.readFileSync('.forgejo/workflows/home-sync.yml', 'utf8').replaceAll('\r', '');
          const section = yaml.slice(yaml.indexOf('- name: Publish the complete draft'));
          const match = section.match(/node <<'JS'\n([\s\S]*?)\n\s+JS/);
          assert.ok(match, 'test must run the real publication step');
          const code = match[1].replace(/^ {10}/gm, '');
          let current, requests;
          const server = http.createServer((req, res) => {
            requests.push(req.method);
            assert.equal(req.headers.authorization, 'token ci-release-token');
            res.setHeader('Content-Type', 'application/json');
            if (req.method === 'GET') {
              assert.equal(req.url, '/releases/tags/v1.2.3');
              res.statusCode = current.getDenied ? 403 : 200;
              res.end(JSON.stringify({id: 7, draft: current.draft !== false,
                prerelease: !!current.prerelease, assets: current.empty ? [] : [{name: 'tool.exe'}]}));
            } else {
              assert.equal(req.method, 'PATCH');
              assert.equal(req.url, '/releases/7');
              let body = '';
              req.on('data', chunk => body += chunk);
              req.on('end', () => {
                assert.deepEqual(JSON.parse(body), {draft: false});
                res.statusCode = current.patchDenied ? 403 : 200;
                res.end('{"draft":false}');
              });
            }
          });
          (async () => {
            await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
            try {
              const cases = [
                {name: 'ready draft', exit: 0, methods: ['GET', 'PATCH']},
                {name: 'empty draft', empty: true, exit: 1, methods: ['GET']},
                {name: 'prerelease', prerelease: true, exit: 1, methods: ['GET']},
                {name: 'lookup denied', getDenied: true, exit: 1, methods: ['GET']},
                {name: 'publication denied', patchDenied: true, exit: 1, methods: ['GET', 'PATCH']},
                {name: 'already public', draft: false, exit: 0, methods: ['GET']},
                {name: 'no token', token: '', exit: 1, methods: []},
                {name: 'invalid tag', tag: '../other', exit: 1, methods: []}
              ];
              for (current of cases) {
                requests = [];
                let output = '';
                const result = await new Promise((resolve, reject) => {
                  const child = spawn(process.execPath, ['-e', code], {env: {...process.env,
                    API: `http://127.0.0.1:${server.address().port}`,
                    TAG: current.tag ?? 'v1.2.3', TOKEN: current.token ?? 'ci-release-token'}});
                  child.stdout.on('data', chunk => output += chunk);
                  child.stderr.on('data', chunk => output += chunk);
                  child.on('error', reject);
                  child.on('close', resolve);
                });
                assert.equal(result, current.exit, `${current.name}: ${output}`);
                assert.deepEqual(requests, current.methods, current.name);
                assert.ok(!output.includes('ci-release-token'), 'token must not reach logs');
                console.log(`passed: ${current.name}`);
              }
            } finally { await new Promise(resolve => server.close(resolve)); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS

  # The check every repo's CI runs (actions/check-fetches), on its tests and on this repo.
  check-fetches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The check's tests
        run: python3 -m unittest discover -v actions/check-fetches/tests
      - uses: ./actions/check-fetches

  # The setup step (actions/home-cache) on each kind of runner, then a real fetch through it.
  home-cache-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/home-cache
      - name: apt reads Ubuntu through Artifact Keeper
        run: |
          set -euo pipefail
          grep -rq 'artifacts.home.romaine.life/debian/ubuntu/' /etc/apt/sources.list /etc/apt/sources.list.d/
          ! grep -rqE 'https?://(archive|security)\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d/
          sudo apt-get update
          apt-get download hello
      - name: cargo reads crates through Artifact Keeper
        run: |
          set -euo pipefail
          command -v cargo >/dev/null || { echo "no cargo in this image; its config is checked instead"; grep -q 'cargo/crates' "${CARGO_HOME:-$HOME/.cargo}/config.toml"; exit 0; }
          d=$(mktemp -d)
          cargo init -q --vcs none "$d/probe"
          printf 'itoa = "1"\n' >> "$d/probe/Cargo.toml"
          cargo fetch -v --manifest-path "$d/probe/Cargo.toml" 2>&1 | tee "$d/log"
          grep -q 'artifacts.home.romaine.life' "$d/log"

  home-cache-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/home-cache
      - name: cargo and NuGet name Artifact Keeper
        shell: pwsh
        run: |
          $cargo = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          if (-not (Select-String -Quiet -LiteralPath (Join-Path $cargo 'config.toml') -Pattern 'artifacts.home.romaine.life/cargo/crates')) { throw 'cargo config' }
          if (-not (Select-String -Quiet -LiteralPath (Join-Path $env:APPDATA 'NuGet\NuGet.Config') -Pattern 'artifacts.home.romaine.life/nuget')) { throw 'NuGet config' }
