name: Release and Dispatch Template

# Forgejo copy of .github/workflows/release-and-dispatch-template.yml.
#
# Cuts a release at the current HEAD of the calling repo's branch, optionally
# dispatches the repo's artifact-build workflow with that tag, pushes the new
# tag to the GitHub push mirror, and optionally dispatches a workflow in
# downstream repos. If HEAD already has a released version tag it does nothing,
# so two callers converging on one commit never cut two tags.
#
# Call it from a job with no runs-on:
#
#   release:
#     uses: romaine-life/pipeline-templates/.forgejo/workflows/release-and-dispatch-template.yml@main
#     secrets: inherit
#
# PIPELINE_DISPATCH_TOKEN (romaine-life org secret, nelson, write:repository)
# makes the dispatches and the mirror sync. The release itself is created with
# the job's own token.

on:
  workflow_call:
    inputs:
      dispatch-repos:
        description: |
          Comma-separated repo names in the caller's owner whose
          dispatch-workflow is run on main after releasing. Empty = none.
        required: false
        type: string
        default: ''
      dispatch-workflow:
        description: 'Workflow file run in each dispatch-repos repo'
        required: false
        type: string
        default: 'dispatch.yml'
      version-prefix:
        description: 'Tag prefix for auto-incrementing patch (e.g. v0.1 -> v0.1.0, v0.1.1, ...)'
        required: false
        type: string
        default: 'v0.1'
      artifact-build-workflow:
        description: |
          Optional workflow file in the caller repo (e.g. 'build.yml') run
          after the release is cut, with a 'tag' input; it checks out the tag
          and uploads assets to the existing release.
        required: false
        type: string
        default: ''
      draft-release:
        description: Keep the release draft until the artifact build publishes it with the home-sync trigger.
        type: boolean
        default: false
      target-repository:
        description: 'Repository to release when dispatched by an authenticated caller'
        required: false
        type: string
        default: ''
      target-ref:
        description: 'Target branch or commit; defaults to the calling workflow ref'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Validate checkout and release access without publishing'
        required: false
        type: string
        default: 'false'
      status-sha:
        description: 'Optional target commit to receive the Release validation status'
        required: false
        type: string
        default: ''
    outputs:
      new-tag:
        description: 'The tag cut by this run (empty if skipped)'
        value: ${{ jobs.release.outputs.new-tag }}

  workflow_dispatch:
    inputs:
      target-repository:
        description: 'owner/repo to release'
        required: true
        type: string
      target-ref:
        description: 'Target branch or commit'
        required: true
        type: string
      dry-run:
        description: 'Validate without creating a release or dispatching builds'
        required: false
        type: string
        default: 'true'
      status-sha:
        description: 'Optional commit to receive the Release validation status'
        required: false
        type: string
        default: ''
      version-prefix:
        description: 'Version tag prefix'
        required: false
        type: string
        default: 'v0.1'
      artifact-build-workflow:
        description: 'Target workflow to build the release artifacts'
        required: false
        type: string
        default: ''
      draft-release:
        description: 'Keep the release draft for publication by the artifact build'
        type: boolean
        default: false
      dispatch-repos:
        description: 'Comma-separated downstream repositories'
        required: false
        type: string
        default: ''
      dispatch-workflow:
        description: 'Downstream workflow'
        required: false
        type: string
        default: 'dispatch.yml'

concurrency:
  group: release-${{ inputs.target-repository || github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      new-tag: ${{ steps.release.outputs.new-tag }}
    env:
      API: ${{ github.server_url }}/api/v1/repos/${{ inputs.target-repository || github.repository }}
      TARGET_REPOSITORY: ${{ inputs.target-repository || github.repository }}
      TARGET_REF: ${{ inputs.target-ref || github.ref_name }}
    steps:
      # ref=ref_name resolves the branch's HEAD at run time, not the sha
      # captured when the run was scheduled.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repository || github.repository }}
          ref: ${{ inputs.target-ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ inputs.target-repository && secrets.PIPELINE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Validate release access
        env:
          T: ${{ inputs.target-repository && secrets.PIPELINE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -sS --fail-with-body -H "Authorization: token $T" "$API" > repository.json
          jq -e '.permissions.push == true' repository.json > /dev/null

      - name: Head commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The one numbering step every home release uses (PIPT-7): the commit's tag in the
      # series if it has one, else the next number, reserved on it.
      - name: Number the release
        id: version
        if: inputs.dry-run != 'true'
        uses: romaine-life/pipeline-templates/actions/release-version@main
        with:
          prefix: ${{ inputs.version-prefix }}
          publish: 'true'
          sha: ${{ steps.head.outputs.sha }}
          repository: ${{ inputs.target-repository || github.repository }}
          token: ${{ inputs.target-repository && secrets.PIPELINE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Skip if HEAD already released
        id: check
        if: inputs.dry-run != 'true'
        env:
          FJ: ${{ inputs.target-repository && secrets.PIPELINE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: token $FJ" "$API/releases/tags/$TAG")
          case "$code" in
            200) echo "$TAG is already released, skipping"; echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::release lookup for $TAG returned HTTP $code"; exit 1 ;;
          esac

      - name: Finish dry run
        if: inputs.dry-run == 'true'
        run: echo "Validated release access for $TARGET_REPOSITORY at $(git rev-parse HEAD)"

      - name: Create release
        id: release
        if: steps.check.outputs.skip != 'true' && inputs.dry-run != 'true'
        env:
          FJ: ${{ inputs.target-repository && secrets.PIPELINE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.head.outputs.sha }}
          DRAFT: ${{ inputs.draft-release || false }}
        run: |
          echo "Cutting release $TAG at $SHA"
          body=$(jq -n --arg tag "$TAG" --arg sha "$SHA" --arg notes "$(git log -1 --format=%s)" --argjson draft "$DRAFT" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $notes, draft: $draft}')
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: token $FJ" -H 'Content-Type: application/json' \
            -d "$body" "$API/releases")
          if [ "$code" != 201 ]; then
            echo "::error::creating release $TAG returned HTTP $code"
            cat response.json
            exit 1
          fi
          echo "new-tag=$TAG" >> "$GITHUB_OUTPUT"

      # The workflow must accept a `tag` input, check out that tag, build, and
      # upload assets to the existing release.
      - name: Dispatch artifact build
        if: steps.check.outputs.skip != 'true' && inputs.dry-run != 'true' && inputs.artifact-build-workflow != ''
        env:
          DT: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          WF: ${{ inputs.artifact-build-workflow }}
          REF: ${{ inputs.target-ref || github.ref_name }}
          TAG: ${{ steps.release.outputs.new-tag }}
        run: |
          body=$(jq -n --arg ref "$REF" --arg tag "$TAG" '{ref: $ref, inputs: {tag: $tag}}')
          curl -sS --fail-with-body -X POST \
            -H "Authorization: token $DT" -H 'Content-Type: application/json' \
            -d "$body" "$API/actions/workflows/$WF/dispatches"
          echo "Dispatched $WF with tag=$TAG"

      # The push mirror would carry the tag within its interval; sync now so
      # GitHub (go install, the Mac jobs) has it at once.
      - name: Sync push mirror
        if: steps.check.outputs.skip != 'true' && inputs.dry-run != 'true'
        env:
          DT: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          # Reserving a tag also starts sync_on_commit. A concurrent sync can
          # briefly reject a ref that the first request has just created.
          curl -sS --fail-with-body --retry 5 --retry-delay 2 -X POST -H "Authorization: token $DT" "$API/push_mirrors-sync"

      - name: Notify downstream consumers
        if: steps.check.outputs.skip != 'true' && inputs.dry-run != 'true' && inputs.dispatch-repos != ''
        env:
          DT: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          REPOS: ${{ inputs.dispatch-repos }}
          WF: ${{ inputs.dispatch-workflow }}
        run: |
          owner=${TARGET_REPOSITORY%%/*}
          for repo in $(echo "$REPOS" | tr ',' ' '); do
            echo "Dispatching $WF on $repo"
            curl -sS --fail-with-body -X POST \
              -H "Authorization: token $DT" -H 'Content-Type: application/json' \
              -d '{"ref":"main"}' "${{ github.server_url }}/api/v1/repos/$owner/$repo/actions/workflows/$WF/dispatches"
          done

      - name: Report validation to the caller
        if: always() && inputs.status-sha != ''
        env:
          T: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          SHA: ${{ inputs.status-sha }}
          RESULT: ${{ job.status }}
          WORKFLOW_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          workflow_url=$(curl -sS --fail-with-body -H "Authorization: token $T" "$WORKFLOW_API" | jq -er .html_url)
          run_url="$workflow_url/actions/runs/$RUN_NUMBER"
          state=success
          [ "$RESULT" = success ] || state=failure
          body=$(jq -n --arg state "$state" --arg url "$run_url" \
            '{state: $state, context: "Release validation", description: "Authenticated release workflow validation", target_url: $url}')
          curl -sS --fail-with-body -X POST -H "Authorization: token $T" \
            -H 'Content-Type: application/json' -d "$body" "$API/statuses/$SHA"
