name: Go Dependency Update Template

# A repo's take-up of the romaine-life modules it builds on (PIPT-3). Takes `modules`
# at their latest into `<go-mod-path>/go.mod`, opens a pull request for it, has Forgejo
# merge it once its checks pass, and exits. No runner waits on the PR's checks: those
# need the same runners. The merge reaches main like any other change and is released
# the way the caller releases every change: its push trigger, or strip-owner starting
# its release.yml, as strip-owner starts every take-up.
#
# Call it from the caller's .forgejo/workflows/dispatch.yml, in a job with no runs-on,
# under a concurrency group that keeps one run at a time:
#
#   concurrency:
#     group: dependency-update
#     cancel-in-progress: false
#   jobs:
#     update:
#       uses: romaine-life/pipeline-templates/.forgejo/workflows/go-dependency-update-template.yml@main
#       secrets: inherit
#       with:
#         modules: github.com/romaine-life/fzt github.com/romaine-life/fzt-terminal
#
# One take-up is open at a time. An open one was branched from an older main: once
# another lands it conflicts and never merges (AGENT-242). This run takes every module
# at its latest, so it carries what an open one carries; those are closed first, and
# this one branches from main as it stands after them.
#
# Module paths stay github.com/romaine-life/...: every module is read from its repo on
# Forgejo, so a take-up never waits on GitHub. agent-tools' is a copy of GitHub's with
# pull requests off, so its commits link to GitHub's PRs (FORGEJO-29). The reads, branch
# push, PR and merge use PIPELINE_DISPATCH_TOKEN (nelson, write:repository): a push made
# with the job's own token starts neither the PR's CI nor the merge's push workflows.

on:
  workflow_call:
    inputs:
      go-mod-path:
        description: 'Path to the directory containing go.mod (relative to repo root)'
        required: false
        type: string
        default: '.'
      modules:
        description: 'Space-separated list of Go module paths to take at their latest'
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      T: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
      API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
      REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
      BASE: ${{ github.ref_name }}
      MODULES: ${{ inputs.modules }}
      MOD_PATH: ${{ inputs.go-mod-path }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
      GOPRIVATE: github.com/romaine-life/*
      GOSUMDB: 'off'
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read romaine-life modules from Forgejo
        run: |
          org="${{ github.server_url }}/romaine-life/"
          : > "$RUNNER_TEMP/prs-on-github"
          git config --global url."$org".insteadOf "https://github.com/romaine-life/"
          git config --global http."$org".extraHeader "Authorization: Basic $(printf 'x-access-token:%s' "$T" | base64 -w0)"
          for mod in $MODULES; do
            repo=${mod#github.com/romaine-life/}
            repo=${repo%%/*}
            code=$(printf 'header = "Authorization: token %s"\n' "$T" | curl --config - -sS -o "$RUNNER_TEMP/repo.json" -w '%{http_code}' "${{ github.server_url }}/api/v1/repos/romaine-life/$repo")
            case "$code" in
              200) ;;
              404) echo "::error::$repo has no repo on Forgejo"; exit 1 ;;
              *) echo "::error::looking up $repo on Forgejo returned HTTP $code"; exit 1 ;;
            esac
            if [ "$(jq -r .has_pull_requests "$RUNNER_TEMP/repo.json")" = false ]; then
              echo "$repo" >> "$RUNNER_TEMP/prs-on-github"
            fi
          done

      - name: Close the take-ups this one supersedes
        run: |
          api() { printf 'header = "Authorization: token %s"\n' "$T" | curl --config - -sS --fail-with-body -H 'Content-Type: application/json' "$@"; }
          api "$API/pulls?state=open&limit=50" | jq -c '.[] | select(.head.ref | startswith("deps/"))' > "$RUNNER_TEMP/open"
          while read -r pr; do
            n=$(jq -r .number <<< "$pr"); ref=$(jq -r .head.ref <<< "$pr")
            # Said in its description: the token has no issue scope, which a comment needs.
            api -o /dev/null -X PATCH -d "$(jq -n --arg old "$(jq -r '.body // ""' <<< "$pr")" --arg run "$RUN_URL" \
              '{state: "closed", body: ($old + "\n\nSuperseded by " + $run + ", which takes the modules at their latest and so carries this (AGENT-242).")}')" "$API/pulls/$n"
            api -o /dev/null -X DELETE "$API/branches/$ref"
            echo "Closed #$n ($ref)"
          done < "$RUNNER_TEMP/open"
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; printf "password=%s\n" "$T"; }; f' \
            fetch -q "$REMOTE" "$BASE"
          git reset -q --hard FETCH_HEAD

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-mod-path }}/go.mod
          cache: false

      - name: Take the modules at their latest
        id: take
        working-directory: ${{ inputs.go-mod-path }}
        run: |
          : > "$RUNNER_TEMP/old"
          for mod in $MODULES; do
            echo "$mod $(go list -m -f '{{.Version}}' "$mod")" >> "$RUNNER_TEMP/old"
          done
          for mod in $MODULES; do
            go get "$mod@latest"
          done
          go mod tidy
          if git diff --quiet go.mod go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on the latest of $MODULES"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff go.mod
          fi

      - name: Open the take-up and have Forgejo merge it once its checks pass
        if: steps.take.outputs.changed == 'true'
        working-directory: ${{ inputs.go-mod-path }}
        run: |
          # Each module's version, and the commits it carries, read through the same
          # sign-in go get used (AGENT-239).
          ref() { case "$1" in *-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) echo "${1##*-}" ;; *) echo "${1%+incompatible}" ;; esac; }
          short() { case "$1" in *-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) echo "${1##*-}" ;; *) echo "$1" ;; esac; }
          title="Take"; body=""
          while read -r mod old; do
            new=$(go list -m -f '{{.Version}}' "$mod")
            [ "$new" != "$old" ] || continue
            repo=${mod#github.com/romaine-life/}; repo=${repo%%/*}
            title="$title $repo $(short "$new"),"
            git clone -q --bare --filter=blob:none "https://$mod" "$RUNNER_TEMP/$repo.git"
            if grep -qx "$repo" "$RUNNER_TEMP/prs-on-github"; then web="https://github.com/romaine-life/$repo/pull/"; else web="${{ github.server_url }}/romaine-life/$repo/pulls/"; fi # internet: a link in the PR body, not a fetch
            changes=$(git -C "$RUNNER_TEMP/$repo.git" log --reverse --format=%s "$(ref "$old")..$(ref "$new")" |
              sed -E "s|^(.*) \(#([0-9]+)\)\$|- \1 (${web}\2)|; t; s|^|- |")
            [ -n "$changes" ] || changes="- (no commit list: $old..$new is not in its history)"
            body="$body$repo $old → $new:"$'\n\n'"$changes"$'\n\n'
          done < "$RUNNER_TEMP/old"
          title=${title%,}
          printf '%sOpened by %s. https://openproject.romaine.life/wp/PIPT-3\n' "$body" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          printf '%s\n\n' "$title" | cat - "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/message"
          cat "$RUNNER_TEMP/message"

          branch="deps/${{ github.run_id }}"
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.romaine.life"
          git checkout -q -b "$branch"
          git add go.mod go.sum
          git commit -q -F "$RUNNER_TEMP/message"
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; printf "password=%s\n" "$T"; }; f' \
            push -q "$REMOTE" "HEAD:refs/heads/$branch"

          api() { printf 'header = "Authorization: token %s"\n' "$T" | curl --config - -sS -H 'Content-Type: application/json' "$@"; }
          code=$(api -o "$RUNNER_TEMP/pr.json" -w '%{http_code}' -X POST \
            -d "$(jq -n --arg base "$BASE" --arg head "$branch" --arg title "$title" --rawfile body "$RUNNER_TEMP/body.md" '{base: $base, head: $head, title: $title, body: $body}')" \
            "$API/pulls")
          if [ "$code" != 201 ]; then echo "::error::opening the PR returned HTTP $code"; cat "$RUNNER_TEMP/pr.json"; exit 1; fi
          n=$(jq -r .number "$RUNNER_TEMP/pr.json")
          pr=$(jq -r .html_url "$RUNNER_TEMP/pr.json")
          echo "Opened $pr"

          code=$(api -o "$RUNNER_TEMP/merge.json" -w '%{http_code}' -X POST \
            -d '{"Do":"squash","delete_branch_after_merge":true,"merge_when_checks_succeed":true}' "$API/pulls/$n/merge")
          if [ "$code" != 200 ] && [ "$code" != 201 ]; then echo "::error::scheduling the merge of $pr returned HTTP $code"; cat "$RUNNER_TEMP/merge.json"; exit 1; fi
          echo "$pr merges once its checks pass"
