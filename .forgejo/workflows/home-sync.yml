name: Home sync

# The dedicated forced-command key stays on the NAS, in its existing mount.
on:
  workflow_call:
    inputs:
      release-on-push:
        description: Legacy compatibility input; release-tag selects real release calls.
        type: boolean
        default: false
      release-tag:
        description: Complete draft release to publish immediately before starting the PCs.
        type: string
        default: ''
      target-repository:
        description: Optional owner/repo for an authenticated draft-recovery dispatch.
        type: string
        default: ''
      config-merge:
        description: Start the PCs after a configuration merge without publishing a release.
        type: boolean
        default: false
      update-home-checkout:
        description: Fast-forward the NAS home-profile checkout before starting the PCs.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release-tag:
        description: Complete draft to publish; leave empty for the trigger-only smoke test.
        type: string
        default: ''
      target-repository:
        description: owner/repo containing that draft; empty means this repository.
        type: string
        default: ''
      config-merge:
        description: Start the PCs after a configuration merge.
        type: boolean
        default: false
      update-home-checkout:
        description: Update the NAS checkout; target-repository must name the home profile.
        type: boolean
        default: false

jobs:
  pcs:
    # Forgejo reports workflow_call here, not the caller's push/dispatch event.
    # Release and configuration callers explicitly request their side effects.
    if: github.event_name == 'workflow_dispatch' || inputs.release-tag || inputs.config-merge
    concurrency: home-sync-nas-checkout
    # The forced-command SSH key stays on the NAS, not on general Linux runners.
    runs-on: [linux, nas]
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    timeout-minutes: 4
    steps:
      - name: Update the NAS home-profile checkout
        if: inputs.update-home-checkout
        env:
          CHECKOUT_REPOSITORY: ${{ inputs.target-repository || github.repository }}
        run: |
          node <<'JS'
          const {spawnSync} = require('node:child_process');
          if (process.env.CHECKOUT_REPOSITORY !== 'romaine-life/shell-config-profile-home') {
            throw new Error('only the home-profile repository can update its NAS checkout');
          }
          const result = spawnSync('ssh', ['-T', '-i', '/certs/client/home-sync/checkout_id_ed25519',
            '-o', 'IdentitiesOnly=yes', '-o', 'BatchMode=yes',
            '-o', 'UserKnownHostsFile=/certs/client/home-sync/known_hosts',
            '-o', 'StrictHostKeyChecking=yes', '-o', 'ConnectTimeout=10', 'Nelson@nas'],
            {stdio: 'inherit', timeout: 90000});
          if (result.error) throw result.error;
          if (result.status !== 0) throw new Error(`NAS checkout failed: SSH exit ${result.status}`);
          JS

      - name: Publish the complete draft
        if: inputs.release-tag
        env:
          TOKEN: ${{ inputs.target-repository && secrets.PIPELINE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ inputs.target-repository || github.repository }}
          TAG: ${{ inputs.release-tag }}
        run: |
          node <<'JS'
          (async () => {
            const {API, TAG, TOKEN} = process.env;
            if (!/^[A-Za-z0-9][A-Za-z0-9._+-]*$/.test(TAG)) throw new Error('invalid release tag');
            if (!TOKEN) throw new Error('missing repository release token');
            const headers = {Authorization: `token ${TOKEN}`, 'Content-Type': 'application/json'};
            const response = await fetch(`${API}/releases/tags/${encodeURIComponent(TAG)}`, {headers, signal: AbortSignal.timeout(30000)});
            if (!response.ok) throw new Error(`release lookup: HTTP ${response.status}`);
            const release = await response.json();
            if (release.prerelease || !release.assets?.length) throw new Error('release must have its complete stable assets');
            if (release.draft) {
              const publish = await fetch(`${API}/releases/${release.id}`, {
                method: 'PATCH', headers, body: JSON.stringify({draft: false}), signal: AbortSignal.timeout(30000)
              });
              if (!publish.ok) throw new Error(`publish release: HTTP ${publish.status}`);
              console.log(`Published ${TAG} at ${new Date().toISOString()}`);
            } else {
              console.log(`${TAG} is already published`);
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS

      - name: Wake and start all PCs concurrently
        # machine/state.json's sshUser and wakeMac in shell-config-profile-home.
        # Update this inventory when a PC changes.
        env:
          MACHINES: >-
            [{"name":"nelsonpc","user":"nelson"},
             {"name":"upstairspc","user":"upstairspc"},
             {"name":"treadmill","user":"nelsontreadmill","mac":"E8:FF:1E:D8:9B:FB"},
             {"name":"nelsonlaptop","user":"nelsonlaptopuser","away":true}]
        run: |
          node <<'JS'
          const {spawn} = require('node:child_process');
          const fs = require('node:fs');
          const key = '/certs/client/home-sync/id_ed25519';
          const hosts = '/certs/client/home-sync/known_hosts';
          fs.accessSync(key, fs.constants.R_OK);
          fs.accessSync(hosts, fs.constants.R_OK);
          const start = Date.now();
          function ssh(name, destination, connectionAttempts = 24) {
            return new Promise((resolve, reject) => {
              // No remote command: sshd forces the one authorized command.
              const child = spawn('ssh', ['-T', '-i', key, '-o', 'IdentitiesOnly=yes',
                '-o', 'BatchMode=yes', '-o', `UserKnownHostsFile=${hosts}`,
                '-o', 'StrictHostKeyChecking=yes', '-o', 'ConnectTimeout=5',
                '-o', `ConnectionAttempts=${connectionAttempts}`, destination]);
              let output = '';
              child.stdout.on('data', b => output += b);
              child.stderr.on('data', b => output += b);
              child.on('error', reject);
              child.on('close', code => {
                console.log(`${name}: ${Date.now() - start} ms; ${output.trim()}`);
                if (code === 0) return resolve();
                const error = new Error(`${name}: SSH exit ${code}`);
                error.unreachable = code === 255 && /timed out|No route to host|Could not resolve hostname|Network is unreachable/.test(output);
                reject(error);
              });
            });
          }
          async function trigger(pc) {
            // Docker's bridge drops LAN broadcasts. The NAS key entry forces
            // only sudo /usr/syno/sbin/synonet --wake E8:FF:1E:D8:9B:FB eth0.
            // A missed wake should get another packet within the same SSH budget.
            const attempts = pc.mac ? 3 : 1;
            for (let attempt = 1; attempt <= attempts; attempt++) {
              if (pc.mac) await ssh(`${pc.name} wake ${pc.mac}`, 'Nelson@nas');
              try {
                await ssh(pc.name, `${pc.user}@${pc.name}`, pc.mac ? 8 : 24);
                return;
              } catch (error) {
                // A PC marked away (the Wi-Fi laptop) can't be woken and is often
                // asleep or out; it catches up at its next sign-in.
                if (pc.away && error.unreachable) {
                  console.log(`${pc.name}: not reachable, so it updates at its next sign-in`);
                  return;
                }
                if (attempt === attempts) throw error;
                console.log(`${pc.name}: retrying wake after SSH attempt ${attempt}/${attempts}`);
              }
            }
          }
          Promise.allSettled(JSON.parse(process.env.MACHINES).map(trigger)).then(results => {
            for (const result of results) if (result.status === 'rejected') {
              console.error(result.reason.message); process.exitCode = 1;
            }
          });
          JS

  # A job of its own, after the release is published: a cleanup that fails shows as this
  # run's failure without holding back the PCs' update.
  prune-releases:
    needs: pcs
    if: inputs.release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: romaine-life/pipeline-templates/actions/prune-releases@main
        with:
          repository: ${{ inputs.target-repository || github.repository }}
          token: ${{ inputs.target-repository && secrets.PIPELINE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
