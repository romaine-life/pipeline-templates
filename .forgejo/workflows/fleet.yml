name: Fleet

# Every repository's suites and setting topics live in fleet.json. A pull request that
# changes the list or how it is applied shows the changes it would make; its merge makes
# them.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fleet-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          from=${BASE:-$BEFORE}
          if [ -z "$from" ] || [ "$from" = 0000000000000000000000000000000000000000 ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          range="$from...HEAD"; [ "$EVENT" = pull_request ] || range="$from..HEAD"
          if git diff --name-only "$range" | grep -qxE 'fleet\.json|suites/fleet\.mjs|suites/config\.mjs|suites/topics\.mjs|suites/lib\.mjs|\.forgejo/workflows/fleet\.yml'; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - uses: ./actions/suite
        if: steps.scope.outputs.run == 'true'
      - name: Show what the merge would change
        if: steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: node suites/fleet.mjs plan
      - name: Align every repository
        if: steps.scope.outputs.run == 'true' && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: node suites/fleet.mjs apply
