name: Go Dependency Update Template

# Called by consumer repos on repository_dispatch when an upstream publishes.
# Bumps the specified modules in go.mod, merges the bump through a pull
# request once its checks pass, then delegates to
# release-and-dispatch-template.yml to cut the release and notify downstream.
#
# The bump goes through a pull request because consumers require green CI on
# main (repo ruleset), which a direct push can't satisfy. The branch push, PR
# and merge use a romaine-life-infra-bootstrap app token (key in Key Vault):
# a PR opened with the workflow's GITHUB_TOKEN never triggers the PR's CI.
#
# Split into two jobs so the release path is a reusable workflow
# (release-and-dispatch-template.yml) shared with each consumer's release.yml
# (which fires on direct pushes to main). Keeps the dep-update and
# direct-release paths using the exact same release logic — no drift.
#
# Race protection:
#   - `ref: github.ref_name` on checkout → runtime sha resolution, not stale
#     sha from dispatch scheduling (prior 2026-04-16 fzt-frontend v0.1.1
#     incident was a stale-sha bug).
#   - `uses:` call to release template (not workflow_dispatch) → no second
#     scheduling window.
#   - Release template's "skip if HEAD already released" guard protects
#     against duplicate tags when dep-update lands on top of a direct push
#     that the consumer's release.yml already released.

on:
  workflow_call:
    inputs:
      go-mod-path:
        description: 'Path to the directory containing go.mod (relative to repo root)'
        required: false
        type: string
        default: '.'
      modules:
        description: 'Space-separated list of Go module paths to update'
        required: true
        type: string
      dispatch-repos:
        description: 'Comma-separated list of consumer repo names to notify after releasing'
        required: false
        type: string
        default: ''
      dispatch-event:
        description: 'event_type for downstream repository_dispatch'
        required: false
        type: string
        default: 'fzt-updated'
      version-prefix:
        description: 'Tag prefix for auto-incrementing patch (e.g. v0.1 -> v0.1.0)'
        required: false
        type: string
        default: 'v0.1'
      artifact-build-workflow:
        description: 'Optional workflow file in the caller repo to trigger after release'
        required: false
        type: string
        default: ''
    outputs:
      changed:
        description: 'Whether go.mod was updated'
        value: ${{ jobs.update.outputs.changed }}
      new-tag:
        description: 'The tag cut by this run (only set when a release was created)'
        value: ${{ jobs.release.outputs.new-tag }}

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # the bump branch is pushed with the app token, not GITHUB_TOKEN
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-mod-path }}/go.mod

      - name: Update dependencies
        working-directory: ${{ inputs.go-mod-path }}
        env:
          # GOPRIVATE subsumes GOPROXY=direct + skips sum.golang.org for matching
          # modules. Previous `GONOSUMCHECK` was not a recognized Go env var; Go
          # silently ignored it and still hit sum.golang.org, racing indexing.
          GOPRIVATE: github.com/romaine-life/*
          GOSUMDB: off
        run: |
          for mod in ${{ inputs.modules }}; do
            echo "Updating $mod..."
            go get "${mod}@latest"
          done
          go mod tidy

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet ${{ inputs.go-mod-path }}/go.mod ${{ inputs.go-mod-path }}/go.sum; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Already on latest"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff ${{ inputs.go-mod-path }}/go.mod
          fi

      - name: Azure Login via OIDC
        if: steps.diff.outputs.changed == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Get app key from Key Vault
        id: app-key
        if: steps.diff.outputs.changed == 'true'
        run: |
          KEY=$(az keyvault secret show --vault-name ${{ vars.KEY_VAULT_NAME }} --name infra-bootstrap-github-app-private-key --query value -o tsv)
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$KEY"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "private_key<<$EOF" >> $GITHUB_OUTPUT
          echo "$KEY" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Mint app token
        id: app-token
        if: steps.diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 3942172 # romaine-life-infra-bootstrap
          private-key: ${{ steps.app-key.outputs.private_key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge the bump through a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          msg="deps: update $(echo '${{ inputs.modules }}' | sed 's|github.com/romaine-life/||g' | tr ' ' ', ')"
          branch="deps/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add ${{ inputs.go-mod-path }}/go.mod ${{ inputs.go-mod-path }}/go.sum
          git commit -m "$msg"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$branch"
          pr=$(gh pr create -R "$REPO" --base "$BASE" --head "$branch" --title "$msg" --body "Opened by the go-dependency-update template: $RUN_URL")
          echo "Opened $pr"

          # Checks register a few seconds after the PR opens; watching before
          # then reports "no checks" and exits.
          for i in $(seq 1 30); do
            n=$(gh pr view "$pr" -R "$REPO" --json statusCheckRollup --jq '.statusCheckRollup | length')
            [ "$n" -gt 0 ] && break
            sleep 10
          done
          if [ "$n" -eq 0 ]; then echo "::error::no checks started on $pr"; exit 1; fi

          gh pr checks "$pr" -R "$REPO" --watch --fail-fast --interval 20
          gh pr merge "$pr" -R "$REPO" --squash --delete-branch

  # Delegate the release-cut + downstream dispatch to the shared reusable
  # workflow. The exact same template is called directly by each consumer's
  # release.yml on push-to-main, so the two paths stay in lockstep.
  release:
    needs: update
    if: needs.update.outputs.changed == 'true'
    # Can't use local ./.github/... ref from a reusable workflow — must be
    # fully-qualified. Pinned to @main so the release logic stays in lockstep
    # with what consumer release.yml files call.
    uses: romaine-life/pipeline-templates/.github/workflows/release-and-dispatch-template.yml@main
    with:
      dispatch-repos: ${{ inputs.dispatch-repos }}
      dispatch-event: ${{ inputs.dispatch-event }}
      version-prefix: ${{ inputs.version-prefix }}
      artifact-build-workflow: ${{ inputs.artifact-build-workflow }}
