name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      powershell: ${{ steps.diff.outputs.powershell }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo powershell=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qE '\.ps1$|^scripts/ci/|^\.forgejo/workflows/ci\.yml$' <<< "$files"; then
            echo powershell=true >> "$GITHUB_OUTPUT"
          fi

  powershell:
    needs: changes
    if: needs.changes.outputs.powershell == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse under pwsh 7
        shell: pwsh
        run: ./scripts/ci/parse-powershell.ps1
      - name: Parse under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/ci/parse-powershell.ps1

  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: echo "the repo's own Linux checks (JSON parses, no shell scripts, manifests render)"
