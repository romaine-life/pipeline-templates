name: check-fetches
description: >-
  Fails when a workflow or action in the repo fetches from the internet instead of through
  Forgejo's action mirrors and Artifact Keeper (FORGEJO-25). A step in a repo's required
  CI job, after its checkout.
runs:
  using: composite
  steps:
    - name: The check runs in a Linux job
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Host '::error::check-fetches reads only the repo: run it in a Linux job (the Windows runner has no Python)'
        exit 1
    - name: No workflow fetches from the internet
      if: runner.os != 'Windows'
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/check.py" "$GITHUB_WORKSPACE"
