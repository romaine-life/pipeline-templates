name: Suite Go dependencies
'on':
  workflow_dispatch: null
concurrency:
  group: suite-go-dependencies-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  GOMAXPROCS: '4'
  CARGO_BUILD_JOBS: '4'
jobs:
  update:
    enable-openid-connect: true
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: romaine-life/pipeline-templates
        ref: ${{ vars.CI_SUITES_REF || 'main' }}
        path: _ci
        persist-credentials: false
    - uses: ./_ci/actions/suite
      with:
        token: ${{ github.token }}
    - uses: ./_ci/actions/home-cache
    - uses: ./_ci/actions/setup-go
    - id: forgejo-write
      uses: ./_ci/actions/forgejo-token
      with:
        access: write
    - run: node _ci/suites/go/dependencies.mjs
      env:
        TOKEN: ${{ steps.forgejo-write.outputs.token }}
