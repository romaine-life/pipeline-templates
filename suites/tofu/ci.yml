name: Suite tofu
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
  push: null
  workflow_dispatch: null
concurrency:
  group: suite-tofu-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  GOMAXPROCS: '4'
  CARGO_BUILD_JOBS: '4'
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: romaine-life/pipeline-templates
        ref: ${{ vars.CI_SUITES_REF || 'main' }}
        path: _ci
        persist-credentials: false
    - uses: ./_ci/actions/suite
      with:
        token: ${{ github.token }}
    - run: node _ci/suites/inputs.mjs tofu
      id: scope
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BEFORE: ${{ github.event.before }}
    if: github.event_name == 'pull_request' || (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    outputs:
      fingerprints: ${{ steps.scope.outputs.fingerprints }}
      suite-sha: ${{ steps.scope.outputs.suite-sha }}
      reuse: ${{ steps.scope.outputs.reuse }}
      service-test: ${{ steps.scope.outputs.service-test }}
      parse-legacy: ${{ steps.scope.outputs.parse-legacy }}
      plan: ${{ steps.scope.outputs.plan }}
      platforms: ${{ steps.scope.outputs.platforms }}
      windows-powershell: ${{ steps.scope.outputs.windows-powershell }}
      source-release: ${{ steps.scope.outputs.source-release }}
      prefix: ${{ steps.scope.outputs.prefix }}
      prefix-from: ${{ steps.scope.outputs.prefix-from }}
      suffix: ${{ steps.scope.outputs.suffix }}
      node: ${{ steps.scope.outputs.node }}
      tofu: ${{ steps.scope.outputs.tofu }}
      postgres: ${{ steps.scope.outputs.postgres }}
      manticore: ${{ steps.scope.outputs.manticore }}
      greenmail: ${{ steps.scope.outputs.greenmail }}
      apply: ${{ steps.scope.outputs.apply }}
      has-services: ${{ steps.scope.outputs.has-services }}
  check-plan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: romaine-life/pipeline-templates
        ref: ${{ needs.scope.outputs.suite-sha }}
        path: _ci
        persist-credentials: false
    - uses: ./_ci/actions/suite
      with:
        token: ${{ github.token }}
    - uses: ./_ci/actions/home-cache
    - uses: ./_ci/actions/setup-opentofu
      with:
        tofu-version: ${{ needs.scope.outputs.tofu }}
    - uses: ./_ci/actions/azure-cli
    - uses: azure/login@v3
      with:
        client-id: ${{ vars.ARM_CLIENT_ID }}
        tenant-id: ${{ vars.ARM_TENANT_ID }}
        subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
    - run: node _ci/suites/tofu/plan.mjs
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.plan == 'true'
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
    enable-openid-connect: true
  apply:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: romaine-life/pipeline-templates
        ref: ${{ needs.scope.outputs.suite-sha }}
        path: _ci
        persist-credentials: false
    - uses: ./_ci/actions/suite
      with:
        token: ${{ github.token }}
    - uses: ./_ci/actions/home-cache
    - uses: ./_ci/actions/setup-opentofu
      with:
        tofu-version: ${{ needs.scope.outputs.tofu }}
    - uses: ./_ci/actions/azure-cli
    - uses: azure/login@v3
      with:
        client-id: ${{ vars.ARM_CLIENT_ID }}
        tenant-id: ${{ vars.ARM_TENANT_ID }}
        subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
    - run: node _ci/suites/tofu/apply.mjs
    needs: scope
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.scope.outputs.apply
      == 'true'
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
    enable-openid-connect: true

  reused-checks:
    needs:
    - scope
    - check-plan
    if: always() && github.event_name == 'pull_request' && needs.scope.result == 'success' && needs.scope.outputs.fingerprints != '{}'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: romaine-life/pipeline-templates
        ref: ${{ needs.scope.outputs.suite-sha }}
        path: _ci
        persist-credentials: false
    - uses: ./_ci/actions/suite
      with:
        token: ${{ github.token }}
    - run: node _ci/suites/reuse.mjs publish
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CI_FINGERPRINTS: ${{ needs.scope.outputs.fingerprints }}
